name: Native credential custody
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.12.0'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node scripts/build-native.mjs
        if: runner.os == 'macOS'
      - run: npm run build
      - run: npm run build:tests
      - run: node --test --test-name-pattern="native adoption|native fresh vault|browser enrollment stages" tests/cli.test.mjs
      - run: node scripts/native-smoke.mjs
